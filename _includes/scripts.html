<script src="{{ base_path }}/assets/js/main.min.js"></script>

<script>
(function () {
  var root = document.documentElement;
  var btn  = document.getElementById("theme-toggle");
  if (!btn) return;

  var media = window.matchMedia("(prefers-color-scheme: dark)");

  var SUN = '<svg class="theme-toggle__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.4v2.3M12 19.3v2.3M2.4 12h2.3M19.3 12h2.3M5.2 5.2l1.6 1.6M17.2 17.2l1.6 1.6M18.8 5.2l-1.6 1.6M6.8 17.2l-1.6 1.6"/></svg>';
  var MOON = '<svg class="theme-toggle__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.6 14.5A8.6 8.6 0 1 1 9.5 3.4a6.8 6.8 0 0 0 11.1 11.1Z"/></svg>';

  function current() {
    var set = root.getAttribute("data-theme");
    return set ? set : (media.matches ? "dark" : "light");
  }

  function paint() {
    var dark = current() === "dark";
    btn.setAttribute("aria-pressed", String(dark));
    btn.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
    btn.innerHTML = dark ? SUN : MOON;
  }

  btn.addEventListener("click", function () {
    var next = current() === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("theme", next); } catch (e) {}
    paint();
  });

  /* follow the OS while the reader has not chosen for themselves */
  media.addEventListener("change", function () {
    if (!root.getAttribute("data-theme")) paint();
  });

  paint();
})();
</script>
